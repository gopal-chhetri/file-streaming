name: file-streaming

services:
  # ==========================================================================
  # Traefik: Reverse proxy (single entry point, domain-based routing)
  # ==========================================================================
  traefik:
    image: traefik:latest
    container_name: streaming-traefik
    restart: unless-stopped
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --api.dashboard=true
      - --api.debug=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80

  # ==========================================================================
  # PostgreSQL: Source of truth for relational data
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: streaming-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
      POSTGRES_DB: streaming
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streaming']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis: Caching, rate limiting, ephemeral session state
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: streaming-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: streaming-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.redis.rule=Host(`streamingredis.soylab.local`)
      - traefik.http.routers.redis.entrypoints=web
      - traefik.http.services.redis.loadbalancer.server.port=8081

  # ==========================================================================
  # MinIO: S3-compatible object storage (raw uploads + processed HLS)
  # ==========================================================================
  minio:
    image: minio/minio:latest
    container_name: streaming-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`streamingminio.soylab.local`)
      - traefik.http.routers.minio.entrypoints=web
      - traefik.http.services.minio.loadbalancer.server.port=9001

  # ==========================================================================
  # Kafka + Zookeeper: Async messaging (transcoding triggers, heartbeats)
  # ==========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: streaming-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: streaming-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092']
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: streaming-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    labels:
      - traefik.enable=true
      - traefik.http.routers.kafka.rule=Host(`streamingkafka.soylab.local`)
      - traefik.http.routers.kafka.entrypoints=web
      - traefik.http.services.kafka.loadbalancer.server.port=8080

  # ==========================================================================
  # MongoDB: Analytics rollups (flexible document schema)
  # ==========================================================================
  mongodb:
    image: mongo:7
    container_name: streaming-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: streaming
      MONGO_INITDB_ROOT_PASSWORD: streaming
      MONGO_INITDB_DATABASE: streaming
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: streaming-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://streaming:streaming@mongodb:27017/streaming?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongodb:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.mongo.rule=Host(`streamingmongo.soylab.local`)
      - traefik.http.routers.mongo.entrypoints=web
      - traefik.http.services.mongo.loadbalancer.server.port=8081

  # ==========================================================================
  # Backend: NestJS API
  # ==========================================================================
  backend:
    container_name: streaming-backend
    build:
      context: ../../backend
      dockerfile: ../deployments/local-dev/Dockerfile.backend.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
    volumes:
      - ../../backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`streamingapi.soylab.local`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.services.backend.loadbalancer.server.port=3000

  # ==========================================================================
  # Frontend: Aura React + Vite (served by nginx)
  # ==========================================================================
  frontend:
    container_name: streaming-frontend
    build:
      context: ../../frontend
      dockerfile: ../deployments/local-dev/Dockerfile.frontend.dev
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`streaming.soylab.local`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=5173

  # ==========================================================================
  # Transcoding Worker: Kafka consumer + ffmpeg HLS transcoder
  # ==========================================================================
  transcoding-worker:
    container_name: streaming-transcoding-worker
    build:
      context: ../../transcoding-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_BROKERS: kafka:29092
      MINIO_ENDPOINT: minio
      API_BASE_URL: http://backend:3000

volumes:
  postgres_data:
  redis_data:
  minio_data:
  zookeeper_data:
  zookeeper_logs:
  mongodb_data:
